# ============================================================================
# 主配置.toml —— 单一事实源（v1.6 设计稿，第3棒 2026-11-26）
# ----------------------------------------------------------------------------
# 为什么有这个文件：
#   上一棒配置分散三处且数值冲突——
#     config/secrets (Copy 1).toml（IP + hard_limits=20000.0）
#     config/app.toml（paths + hard_limits=5.0 ← 与上面不一致！）
#     src/config.rs（fsync/队列容量等常量）
#   本文件合并全部参数为一处；敏感信息（账号/密码/AuthCode）单独放
#   secrets.toml（不入 git），本文件可整体 git push。
# 取值裁决：max_premium_per_lot 冲突时取 secrets 实盘值 20000.0（风控上限以实盘为准）。
# ============================================================================
[market_data]
# 17 个前置 IP：1 个留交易，16 个做行情 member
md_port = 61213
td_port = 61205
trade_reserved_ip = "101.231.185.21"
member_ips = [
  "101.231.185.57", "101.231.185.58", "101.231.185.59", "101.231.185.60",
  "180.166.83.72", "180.166.83.73", "180.166.83.74", "180.166.83.75",
  "140.206.102.76", "140.206.102.77", "140.206.102.78", "112.65.132.105",
  "112.65.132.21", "112.65.132.22", "112.65.132.23", "112.65.132.25",
]
flow_dir = "./data_数据/flow_会话流文件/md"
contracts_file = "./data_数据/contracts_合约清单/contracts_live.txt"

[collector]
# 对应 src/config.rs「运行配置」结构（toml 有值用 toml，没值用内建默认）
分片落盘秒 = 60          # 0=不额外fsync · 5=极致抗崩 · 60=推荐
bar队列容量 = 1000000
分片目录 = "data_数据/分钟分片"
成品目录 = "data_数据/分钟K线"
归档压缩 = true          # 合并成功后非今日 jsonl 压 .jsonl.zst

[trading.hard_limits]
max_lots_per_order = 1
max_premium_per_lot = 20000.0   # 唯一事实源（原 app.toml 的 5.0 作废）
max_orders_per_minute = 3       # 报单+撤单合并计数
allow_market_order = false      # 只允许限价单
