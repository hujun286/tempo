# ============================================================
# 分钟K线落盘 v2.0 配置（唯一真源：源码里不留魔法数字）
# ------------------------------------------------------------
# 找不到本文件时程序用内置的“同名同义”默认值并打一条 warn，不会崩。
# 可用环境变量 分钟K线配置 指定别的路径：
#   分钟K线配置=/home/xx/projects/ctp-workspace/config/分钟K线_v2.toml
# 默认位置：${CARGO_MANIFEST_DIR}/../配置_分钟K线_v2.toml
#           即 ctp-workspace/配置_分钟K线_v2.toml（与 config/ 平级也行，看你放哪）
# 改完不用重编译，下次启动生效。
# ============================================================

[落盘]

# ---- 快照（防丢当天的机制）--------------------------------
# 0     = 关闭定时快照：全天只攒内存，只有 Ctrl+C（优雅退出）才落一次盘。
#         ✅ 当前选定模式（笔记本有电池、断电风险低）。
#         ⚠️ 风险：kill -9 / 内核OOM / 断电且电池耗尽 → 当天全部在内存的数据丢失。
# >0    = 每 N 秒把“已收盘的整分钟 bar”原子写一次 bars_今日.parquet；
#         同时启用“启动恢复”：重启后自动把当天快照读回内存接着攒。
#         同一套代码两种模式，改这个数就行，代码不动。
# 最小允许值 5 秒（写太频没意义，当前分钟至少 1 分钟才收盘一根）。
# 想用之前说的 53 秒，就写 53。
# 最坏丢失 ≈ 快照间隔 + 1 分钟（当前正在攒的那根不进快照）。
快照间隔秒 = 0

# 原子写：先写 bars_YYYYMMDD.parquet.tmp → fsync → rename 覆盖正式文件。
# 关掉的话进程被杀会留半截 parquet（DuckDB 读会报错）。没有任何理由关。
原子写 = true

# 同日合并：落盘前若目标文件已存在，先读旧 bar 合并去重再写。
# 治的就是 11-24 那次“夜盘 00:00-02:27 被日盘覆盖成 .bak”的问题。
# 去重键 (合约, bar时间)；真实 bar 优先于补的 gap bar。
同日合并 = true

# 双写成交量增量：volume/turnover 存 CTP 当日累计原值（忠实柜台），
# 额外落 volume_1m / turnover_1m = 本根累计 − 同合约同交易日上一根累计。
# 下游回测直接用增量列，避免“拿累计当单分钟量”这个经典坑。
# 关掉则只落累计列（13 列 → 11 列）。
双写成交量增量 = true

# 过滤盘前重演：非交易时段 且 成交量累计=0 的 tick 直接丢。
# 治的是 h5i-db 里看到的 00:57 volume=0 的“盘前重演/结算行情”污染。
# ⚠️ 注意：真·冷门合约在盘中若真的一手没成交也可能被误丢，
#    但它本来 volume=0 也产不出有意义的K线，影响可忽略。
# ★v2.1（20261127）本开关同时控制第二道闸"时戳偏离过滤"：
#    交易所戳(UpdateTime)与本机到达时刻差超 2 分钟 = 登录重演/陈旧快照 → 丢弃（带量的也拦）。
#    实测：01:41 重连时铜(夜盘01:00已收)重发快照曾生成假bar；开启后 18610 个重演快照精准拦截、假bar归零。
#    本机时区必须为北京时间(+08:00)，程序启动时会自动纠察并在时区不对时 ERROR 挑明。
过滤盘前重演 = true

# 输出目录（相对路径拼到工作区根 ctp-workspace 下）
输出目录 = "data_数据/分钟K线/"

[交易时段]
# 全市场粗过滤表（HHMM 整数，闭区间）。用于“盘前重演”判定与统计。
# 不同品种夜盘结束不同（金属 01:00、贵金属/原油 02:30、中金所/广期所无夜盘），
# 这里故意取并集的最宽口径；精确过滤留给合约级时段表（v2.x 可选）。
# 格式：起止对，跨午夜（如 2100→0230）由代码“在交易时段内”特判处理。
时段 = [
  [900, 1015],
  [1030, 1130],
  [1330, 1515],
  [2100, 230],   # 230 = 次日 02:30，代码里识别“止<起”即跨午夜
]
