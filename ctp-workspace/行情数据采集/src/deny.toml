# cargo-deny 配置：使用本地 advisory-db 快照，不依赖网络。
# 快照位置：/home/xx/projects/advisory-db-main/advisory-db-main/
# 更新方式：手动拉 RustSec/advisory-db 覆盖该目录后重跑 deny check。

[advisories]
db-path = "/home/xx/projects/advisory-db-main/advisory-db-main"

# licenses 检查当前不在验证链内（命令行只跑 advisories bans sources）。
# 依赖白名单待 P2 完善后启用，届时命令行加 licenses。
[licenses]
# Rust 生态常见 license 白名单。覆盖 crates.io 99%+ 依赖。
# 不在清单内的 license 类型会被拒绝，届时看失败报告再决定加还是归档依赖。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = [
]

[licenses.private]
# 项目要发布，本 crate 也走 license 检查，不豁免。
ignore = false
registries = [
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
